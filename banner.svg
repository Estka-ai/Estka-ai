<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300">
    <defs>
          <radialGradient id="bg" cx="50%" cy="50%" r="70%">
                  <stop offset="0%" stop-color="#0d1b2a"/>
                  <stop offset="100%" stop-color="#050d18"/>
          </radialGradient>
          <filter id="glow">
                  <feGaussianBlur stdDeviation="3" result="blur"/>
                  <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
          <filter id="softglow">
                  <feGaussianBlur stdDeviation="6" result="blur"/>
                  <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
    </defs>

    <!-- Background -->
    <rect width="900" height="300" fill="url(#bg)"/>

    <!-- Grid lines -->
    <g opacity="0.06" stroke="#58a6ff" stroke-width="0.5">
          <line x1="0" y1="60" x2="900" y2="60"/>
          <line x1="0" y1="120" x2="900" y2="120"/>
          <line x1="0" y1="180" x2="900" y2="180"/>
          <line x1="0" y1="240" x2="900" y2="240"/>
          <line x1="150" y1="0" x2="150" y2="300"/>
          <line x1="300" y1="0" x2="300" y2="300"/>
          <line x1="450" y1="0" x2="450" y2="300"/>
          <line x1="600" y1="0" x2="600" y2="300"/>
          <line x1="750" y1="0" x2="750" y2="300"/>
    </g>

    <!-- Stars -->
    <g fill="white">
          <circle cx="45" cy="25" r="1" opacity="0.6"/>
          <circle cx="120" cy="80" r="1.5" opacity="0.4"/>
          <circle cx="200" cy="40" r="1" opacity="0.7"/>
          <circle cx="310" cy="20" r="1" opacity="0.5"/>
          <circle cx="420" cy="55" r="1.5" opacity="0.3"/>
          <circle cx="530" cy="15" r="1" opacity="0.6"/>
          <circle cx="640" cy="70" r="1" opacity="0.5"/>
          <circle cx="750" cy="30" r="1.5" opacity="0.4"/>
          <circle cx="830" cy="65" r="1" opacity="0.7"/>
          <circle cx="880" cy="20" r="1" opacity="0.5"/>
          <circle cx="60" cy="180" r="1" opacity="0.4"/>
          <circle cx="170" cy="250" r="1.5" opacity="0.3"/>
          <circle cx="280" cy="270" r="1" opacity="0.5"/>
          <circle cx="400" cy="230" r="1" opacity="0.6"/>
          <circle cx="510" cy="280" r="1.5" opacity="0.4"/>
          <circle cx="680" cy="240" r="1" opacity="0.3"/>
          <circle cx="790" cy="270" r="1" opacity="0.5"/>
          <circle cx="860" cy="200" r="1.5" opacity="0.4"/>
    </g>

    <!-- Decorative hex/circuit lines left -->
    <g stroke="#58a6ff" stroke-width="1" fill="none" opacity="0.2">
          <polyline points="30,150 60,120 100,120 130,90"/>
          <polyline points="30,150 60,180 100,180 130,210"/>
          <circle cx="30" cy="150" r="4" fill="#58a6ff" opacity="0.5"/>
          <circle cx="130" cy="90" r="3" fill="#58a6ff" opacity="0.4"/>
          <circle cx="130" cy="210" r="3" fill="#58a6ff" opacity="0.4"/>
    </g>

    <!-- Decorative hex/circuit lines right -->
    <g stroke="#58a6ff" stroke-width="1" fill="none" opacity="0.2">
          <polyline points="870,150 840,120 800,120 770,90"/>
          <polyline points="870,150 840,180 800,180 770,210"/>
          <circle cx="870" cy="150" r="4" fill="#58a6ff" opacity="0.5"/>
          <circle cx="770" cy="90" r="3" fill="#58a6ff" opacity="0.4"/>
          <circle cx="770" cy="210" r="3" fill="#58a6ff" opacity="0.4"/>
    </g>

    <!-- Central glow orb -->
    <circle cx="450" cy="150" r="70" fill="#1a3a5c" opacity="0.15"/>
    <circle cx="450" cy="150" r="50" fill="#1a3a5c" opacity="0.2"/>

    <!-- Brain/AI icon center (stylized) -->
    <g transform="translate(450,150)" filter="url(#softglow)">
          <!-- Outer ring -->
          <circle cx="0" cy="0" r="42" fill="none" stroke="#58a6ff" stroke-width="1.5" opacity="0.8"/>
          <circle cx="0" cy="0" r="36" fill="#0a1628" stroke="#1e3a5f" stroke-width="1"/>
          <!-- AI text -->
          <text x="0" y="-6" text-anchor="middle" font-family="'Courier New', monospace" font-size="18" font-weight="bold" fill="#58a6ff" letter-spacing="2">AI</text>
          <text x="0" y="14" text-anchor="middle" font-family="'Courier New', monospace" font-size="7" fill="#8b949e" letter-spacing="1">PRODUCT</text>
          <text x="0" y="25" text-anchor="middle" font-family="'Courier New', monospace" font-size="7" fill="#8b949e" letter-spacing="1">BUILDER</text>
          <!-- Animated rotating ring -->
          <circle cx="0" cy="0" r="48" fill="none" stroke="#58a6ff" stroke-width="0.8" stroke-dasharray="8 6" opacity="0.5">
                  <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="12s" repeatCount="indefinite"/>
          </circle>
    </g>

    <!-- Main title -->
    <text x="450" y="230" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600" fill="#c9d1d9" letter-spacing="4" filter="url(#glow)">FULL-STACK DEVELOPER &amp; AI PRODUCT BUILDER</text>

    <!-- Subtitle dots -->
    <g fill="#58a6ff" opacity="0.6">
          <circle cx="330" cy="248" r="2"/>
          <circle cx="570" cy="248" r="2"/>
    </g>
    <text x="450" y="252" text-anchor="middle" font-family="'Courier New', monospace" font-size="9" fill="#8b949e" letter-spacing="2">COLOMBIA</text>

    <!-- Bottom accent line -->
    <line x1="200" y1="268" x2="700" y2="268" stroke="#58a6ff" stroke-width="0.5" opacity="0.3"/>
</svg>
